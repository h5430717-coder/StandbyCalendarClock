plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.example.standbyclock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.standbyclock'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
    main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['src/main/java']
        res.srcDirs = ['res']
    }
}
